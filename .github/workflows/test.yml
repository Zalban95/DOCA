# The host runs on Linux, Windows and macOS (docs/design/hive.md §7): every push is tested on all three.
name: test
on:
  push:
    branches: ['**']   # every branch, so a fix is seen on all three OSes before it is merged
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke   # the panel in the runner's Chrome: every tab, no page error (bin/doca-smoke.js)
      - run: npm run smoke -- --core   # the same with no licence: only the core, and nothing calls a route that is not there
      # The installer on each OS, from this checkout into a temp folder, no boot entry: it must end with a panel answering.
      - name: install (Linux, macOS)
        if: runner.os != 'Windows'
        env: { PORT: '4343' }
        run: |
          bash scripts/install.sh --from . --dir "$RUNNER_TEMP/doca-install" --no-boot
          curl -ksf -o /dev/null https://127.0.0.1:4343/login && echo "the installed panel answers"
      - name: install (Windows)
        if: runner.os == 'Windows'
        env: { PORT: '4343' }
        # Windows PowerShell 5.1, not pwsh: it is the one every Windows has, and the installer broke there alone (H1.9).
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -From . -Dir "$env:RUNNER_TEMP\doca-install" -NoBoot -Share no
          if ($LASTEXITCODE -ne 0) { throw "the installer failed ($LASTEXITCODE)" }
          $code = curl.exe -sk -o NUL -w '%{http_code}' https://127.0.0.1:4343/login
          if ($code -ne '200') { throw "the installed panel answered $code" } else { "the installed panel answers" }
  # The hive image (Dockerfile, deploy/README.md): built on Linux, never pushed, made a hive with deploy/hive.sh, asked
  # once, backed up, restored into a second hive, and both removed.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t doca-hive:ci .
      - name: a hive from it
        env: { DOCA_HIVE_IMAGE: 'doca-hive:ci', DOCA_HIVE_BACKUPS: '${{ runner.temp }}/hive-backups' }
        run: |
          bash deploy/hive.sh new hive-ci --port 4310
          curl -ksf https://127.0.0.1:4310/api/branding | grep -q '"profile":"hosted"' && echo "the hive answers, hosted"
          if docker exec hive-ci sh -c true 2>/dev/null; then echo "the image has a shell"; exit 1; fi
          bash deploy/hive.sh backup hive-ci
          bash deploy/hive.sh restore hive-ci-restored "$(ls -t "$DOCA_HIVE_BACKUPS"/*.tgz | head -1)" --port 4320
          curl -ksf -o /dev/null https://127.0.0.1:4320/api/branding && echo "the restored hive answers"
          bash deploy/hive.sh remove hive-ci --yes
          bash deploy/hive.sh remove hive-ci-restored --yes
          docker image ls doca-hive:ci --format 'image: {{.Size}}'
