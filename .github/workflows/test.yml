# The host runs on Linux, Windows and macOS (docs/design/hive.md §7): every push is tested on all three.
name: test
on:
  push:
    branches: ['**']   # every branch, so a fix is seen on all three OSes before it is merged
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke   # the panel in the runner's Chrome: every tab, no page error (bin/doca-smoke.js)
      # The installer on each OS, from this checkout into a temp folder, no boot entry: it must end with a panel answering.
      - name: install (Linux, macOS)
        if: runner.os != 'Windows'
        env: { PORT: '4343' }
        run: |
          bash scripts/install.sh --from . --dir "$RUNNER_TEMP/doca-install" --no-boot
          curl -ksf -o /dev/null https://127.0.0.1:4343/login && echo "the installed panel answers"
      - name: install (Windows)
        if: runner.os == 'Windows'
        env: { PORT: '4343' }
        # Windows PowerShell 5.1, not pwsh: it is the one every Windows has, and the installer broke there alone (H1.9).
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -From . -Dir "$env:RUNNER_TEMP\doca-install" -NoBoot -Share no
          if ($LASTEXITCODE -ne 0) { throw "the installer failed ($LASTEXITCODE)" }
          $code = curl.exe -sk -o NUL -w '%{http_code}' https://127.0.0.1:4343/login
          if ($code -ne '200') { throw "the installed panel answered $code" } else { "the installed panel answers" }
