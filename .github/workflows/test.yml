# The host runs on Linux, Windows and macOS (docs/design/hive.md §7): every push is tested on all three.
name: test
on:
  push:
    branches: ['**']   # every branch, so a fix is seen on all three OSes before it is merged
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
